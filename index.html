<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LireMonde</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVIGATION -->
  <nav>
    <div class="navbar-brand">
                <a href="index.html" class="logo">
                    <img src="images/Download_free_png_of_PNG_Vintage_book_with_quill__transparent_background_by_Nardsucha_about_open_book_png__quill_pen__feather_pen__open_book__and_quill_15160467-removebg-preview.png" alt="Olive Logo" class="logo-img">
                    <span class="logo-text">LIRE MONDE</span>
                </a>
      </div>

    <ul class="navbar-menu">
      <li><a href="#">Accueil</a></li>
      <li><a href="#">Bibliothèque</a></li>
      <li><a href="#">Collections</a></li>
      <li><a href="#">Cathégories</a></li>
    </ul>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <!-- Background layers -->
    <div class="hero-bg-fallback"></div>
    <div class="hero-bg"></div>

    <!-- Content -->
    <div class="hero-content">
      <div class="hero-eyebrow">
        <div class="hero-eyebrow-line"></div>
        <span class="hero-eyebrow-text">Bibliothèque Universelle</span>
      </div>

      <h1 class="hero-title">
        La connaissance<br>
        est une <em>lumière</em><br>
        dans l'obscurité
      </h1>

      <p class="hero-desc">
        Explorez des milliers d'ouvrages classiques et contemporains.
        Lisez, apprenez, inspirez-vous.
      </p>

      <a href="#" class="hero-cta">
        Explorez la bibliothèque
        <span class="hero-cta-arrow"></span>
      </a>
    </div>

    <!-- Scroll indicator -->
    <div class="scroll-hint">
      <div class="scroll-hint-line"></div>
      <span class="scroll-hint-label">Défiler</span>
    </div>

    <!-- Decorative SVG corner -->
    <svg class="corner-deco" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M 180 0 L 180 180 L 0 180" stroke="#c9a96e" stroke-width="1"/>
      <path d="M 180 40 L 140 180" stroke="#c9a96e" stroke-width=".5"/>
      <path d="M 180 80 L 80 180" stroke="#c9a96e" stroke-width=".5"/>
      <circle cx="180" cy="180" r="60" stroke="#c9a96e" stroke-width=".5"/>
      <circle cx="180" cy="180" r="30" stroke="#c9a96e" stroke-width=".5"/>
    </svg>
  </section>

</body>
</html>
