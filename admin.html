<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LireMonde — Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cinzel:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- NAVIGATION -->
  <nav>
    <div class="navbar-brand">
      <a href="index.html" class="logo">
        <img
          src="images/Download_free_png_of_PNG_Vintage_book_with_quill__transparent_background_by_Nardsucha_about_open_book_png__quill_pen__feather_pen__open_book__and_quill_15160467-removebg-preview.png"
          alt class="logo-img" />
        <span class="logo-text">LIRE MONDE</span>
      </a>
    </div>

    <ul class="navbar-menu">
      <li><a href="index.html">Accueil</a></li>
      <li><a href="admin.html">admin</a></li>
    </ul>
  </nav>

  <!-- ===== ADMIN PAGE ===== -->
  <section class="admin-page">
    <!-- Header -->
    <div class="admin-header">
      <div class="header-left">
        <h1>Gestion des Livres</h1>
        <p>Gérez tous les livres de la bibliothèque</p>
      </div>
      <button id="openAddModal" class="add-book-btn">
        <i class="fa-solid fa-plus"></i> Ajouter un livre
      </button>
    </div>

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat-card">
        <i class="fa-solid fa-book-open"></i>
        <div class="stat-info">
          <span>Total livres</span>
          <strong id="statTotal">—</strong>
        </div>
      </div>
    </div>

    <!-- Search -->
    <div class="search-row">
      <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Rechercher par titre ou auteur…" />
      </div>
    </div>

    <!-- Table -->
    <section class="table-section">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Couverture</th>
            <th>Titre</th>
            <th>Auteur</th>
            <th>Genre</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </section>
  </section>

  <!-- ===== MODAL AJOUTER / MODIFIER ===== -->
  <div id="adminModal" class="admin-modal">
    <div class="admin-modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Ajouter un livre</h2>
        <button class="modal-close" id="modalCloseX">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="bookForm">
        <input type="hidden" id="bookId" />

        <div class="form-row">
          <div class="form-group">
            <label for="title">Titre</label>
            <input type="text" id="title" placeholder="Ex : Dracula…" required />
          </div>
          <div class="form-group">
            <label for="author">Auteur</label>
            <input type="text" id="author" placeholder="Ex : Bram Stoker…" required />
          </div>
        </div>

        <label for="genre">Genre</label>
        <select id="genre" required>
          <option value="">Sélectionner un genre</option>
          <option>ROMAN PHILOSOPHIQUE</option>
          <option>ROMAN CLASSIQUE</option>
          <option>ROMAN HISTORIQUE</option>
          <option>Science-fiction</option>
          <option>ROMAN GOTHIQUE</option>
          <option>Horreur</option>
          <option>Romance</option>
          <option>Policier</option>
        </select>

        <label for="description">Description</label>
        <textarea id="description" placeholder="Description du livre…" required></textarea>

        <label for="cover">Couverture (URL)</label>
        <input type="text" id="cover" placeholder="https://example.com/cover.jpg" required />
        <img id="coverPreview" class="cover-preview" alt="Aperçu" />

        <div class="toggle-row">
          <span>À lire</span>
          <label class="toggle">
            <input type="checkbox" id="alireToggle" checked />
            <span class="slider"></span>
          </label>
        </div>

        <div class="form-buttons">
          <button type="button" id="cancelBtn" class="cancel-btn">
            Annuler
          </button>
          <button type="submit" id="saveBtn" class="save-btn">
            <i class="fa-solid fa-floppy-disk"></i> Enregistrer
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== CONFIRMATION SUPPRESSION ===== -->
  <div id="confirmOverlay" class="confirm-overlay">
    <div class="confirm-box">
      <i class="fa-solid fa-triangle-exclamation"></i>
      <h3>Supprimer ce livre ?</h3>
      <p>Cette action est irréversible.</p>
      <div class="confirm-btns">
        <button class="confirm-cancel" id="confirmCancel">Annuler</button>
        <button class="confirm-delete" id="confirmDelete">
          <i class="fa-solid fa-trash"></i> Supprimer
        </button>
      </div>
    </div>
  </div>

  <!-- ===== TOASTS ===== -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ===== FOOTER ===== -->
  <footer>
    <p>© 2026 LireMonde — Plateforme de lecture numérique</p>
  </footer>

  <script src="admin.js"></script>
</body>

</html>
